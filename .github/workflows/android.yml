name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK targets
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test vocabulary and quiz engine
        run: ./gradlew --no-daemon :engine:test
      - name: Test Android application
        run: ./gradlew --no-daemon :app:testUniversalDebugUnitTest
      - name: Android Lint
        run: ./gradlew --no-daemon :app:lintUniversalDebug
      - name: Build empty universal APK
        run: ./gradlew --no-daemon :app:assembleUniversalDebug -PappVersionCode=2 -PappVersionName=1.1.0
      - name: Prepare verified test download
        run: ./scripts/package-test-apk.sh --build-tools "$ANDROID_HOME/build-tools/35.0.0"
      - name: Verify dedicated APK and unsigned release bundles
        run: >-
          ./gradlew --no-daemon :app:assembleDedicatedDebug :app:bundleUniversalRelease :app:bundleDedicatedRelease
          -PdedicatedPack="$PWD/app/src/test/resources/variant-pack.zip"
          -PdedicatedBrandingDir="$PWD/app/src/test/resources/branding"
          -PdedicatedId=org.langue.ci
          "-PdedicatedName=L'atelier & langues"
          -PappVersionCode=2 -PappVersionName=1.1.0
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            engine/build/reports/
            app/build/reports/
          if-no-files-found: ignore
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-debug-apk
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test installation files
        uses: actions/upload-artifact@v4
        with:
          name: langue-installation-test
          path: |
            app/build/distribution/test/langue.apk
            app/build/distribution/test/RELEASE_NOTES.md
            app/build/distribution/test/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
